<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 90" fill="none">
  <defs>
    <linearGradient id="metalGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="blueCapsule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
  <!-- Brushed metal container -->
  <path d="M 20 18 L 240 28 L 230 75 L 25 68 Z" fill="url(#metalGrad)" stroke="#64748b" stroke-width="1.5" rx="6"/>
  <!-- سبوتلس text in 3D white with shadow -->
  <text x="128" y="48" font-family="'Amiri', 'Traditional Arabic', 'Segoe UI', Tahoma, sans-serif" font-weight="900" font-size="34" fill="#334155" text-anchor="middle">سبوتلس</text>
  <text x="126" y="46" font-family="'Amiri', 'Traditional Arabic', 'Segoe UI', Tahoma, sans-serif" font-weight="900" font-size="34" fill="#ffffff" text-anchor="middle">سبوتلس</text>
  <!-- Blue capsule -->
  <rect x="70" y="52" width="120" height="20" rx="10" fill="url(#blueCapsule)" stroke="#bae6fd" stroke-width="1"/>
  <text x="130" y="66" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" fill="#ffffff" text-anchor="middle">كريم للوجه</text>
</svg>
