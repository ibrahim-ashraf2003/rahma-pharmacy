<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 110" fill="none">
  <!-- Eva Logo Top in Plum/Deep Violet -->
  <g transform="translate(70, 4) scale(0.55)">
    <polygon points="30,5 50,5 60,22 50,40 30,40 20,22" stroke="#4a154b" stroke-width="3" fill="none" stroke-linejoin="round"/>
    <polygon points="70,5 90,5 100,22 90,40 70,40 60,22" stroke="#4a154b" stroke-width="3" fill="none" stroke-linejoin="round"/>
    <polygon points="110,5 130,5 140,22 130,40 110,40 100,22" stroke="#4a154b" stroke-width="3" fill="none" stroke-linejoin="round"/>
    <text x="40" y="27" font-family="'Times New Roman', serif" font-style="italic" font-weight="bold" font-size="22" fill="#4a154b" text-anchor="middle">Є</text>
    <text x="80" y="27" font-family="'Times New Roman', serif" font-style="italic" font-weight="bold" font-size="22" fill="#4a154b" text-anchor="middle">υ</text>
    <text x="120" y="27" font-family="'Times New Roman', serif" font-style="italic" font-weight="bold" font-size="22" fill="#4a154b" text-anchor="middle">a</text>
    <path d="M 20 48 Q 80 43 140 48" stroke="#4a154b" stroke-width="2" fill="none"/>
  </g>

  <!-- HAIR CLINIC -->
  <text x="125" y="42" font-family="system-ui, sans-serif" font-weight="800" font-size="12" fill="#4a154b" text-anchor="middle" letter-spacing="2">HAIR CLINIC</text>

  <!-- Gold Argan in Deep Purple -->
  <g fill="#4a154b" font-family="system-ui, -apple-system, sans-serif" font-weight="900">
    <text x="125" y="75" font-size="34" text-anchor="middle" letter-spacing="-0.5">Gold</text>
    <text x="125" y="100" font-size="28" text-anchor="middle" letter-spacing="1">Argan</text>
  </g>
</svg>
