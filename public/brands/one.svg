<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 110" fill="none">
  <!-- Hair follicle extraction icon over 'n' -->
  <g transform="translate(142, 10) scale(0.7)">
    <path d="M 0 35 Q 20 15 15 -10" stroke="#003594" stroke-width="2.5" fill="none"/>
    <ellipse cx="0" cy="35" rx="6" ry="10" fill="#003594"/>
    <line x1="-15" y1="20" x2="-3" y2="28" stroke="#003594" stroke-width="2.5"/>
    <line x1="15" y1="20" x2="3" y2="28" stroke="#003594" stroke-width="2.5"/>
  </g>

  <!-- One text with strong blue outline and pure white fill -->
  <g font-family="'Times New Roman', Georgia, serif" font-style="italic" font-weight="900" font-size="82">
    <!-- Blue thick outline -->
    <text x="120" y="88" fill="#0033a0" stroke="#0033a0" stroke-width="12" stroke-linejoin="round" text-anchor="middle">One</text>
    <!-- White core fill -->
    <text x="120" y="88" fill="#ffffff" text-anchor="middle">One</text>
    <!-- Registered trademark -->
    <text x="215" y="88" font-family="sans-serif" font-style="normal" font-size="14" fill="#0033a0" stroke="none">®</text>
  </g>
</svg>
