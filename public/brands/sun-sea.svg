<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 100" fill="none">
  <!-- Eva Logo Top in Royal Blue -->
  <g transform="translate(68, 4) scale(0.55)">
    <polygon points="30,5 50,5 60,22 50,40 30,40 20,22" stroke="#003594" stroke-width="3" fill="none" stroke-linejoin="round"/>
    <polygon points="70,5 90,5 100,22 90,40 70,40 60,22" stroke="#003594" stroke-width="3" fill="none" stroke-linejoin="round"/>
    <polygon points="110,5 130,5 140,22 130,40 110,40 100,22" stroke="#003594" stroke-width="3" fill="none" stroke-linejoin="round"/>
    <text x="40" y="27" font-family="'Times New Roman', serif" font-style="italic" font-weight="bold" font-size="22" fill="#003594" text-anchor="middle">Є</text>
    <text x="80" y="27" font-family="'Times New Roman', serif" font-style="italic" font-weight="bold" font-size="22" fill="#003594" text-anchor="middle">υ</text>
    <text x="120" y="27" font-family="'Times New Roman', serif" font-style="italic" font-weight="bold" font-size="22" fill="#003594" text-anchor="middle">a</text>
    <path d="M 20 48 Q 80 43 140 48" stroke="#003594" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Sun graphic -->
  <g transform="translate(160, 42)">
    <!-- Sun rays -->
    <line x1="0" y1="-18" x2="0" y2="-25" stroke="#fdb813" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="13" y1="-13" x2="18" y2="-18" stroke="#fdb813" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="18" y1="0" x2="25" y2="0" stroke="#fdb813" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="13" y1="13" x2="18" y2="18" stroke="#fdb813" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Sun core -->
    <circle cx="0" cy="0" r="17" fill="#fdb813"/>
  </g>

  <!-- sun & sea typography -->
  <g fill="#003594" font-family="system-ui, -apple-system, sans-serif" font-weight="900">
    <text x="25" y="58" font-size="44" letter-spacing="-1">sun</text>
    <text x="25" y="92" font-size="44" letter-spacing="-1">&amp; sea</text>
  </g>

  <!-- Blue wave flourish under sea -->
  <path d="M 145 88 Q 165 72 195 85 Q 215 90 225 84 Q 215 93 185 88 Z" fill="#0099ff"/>
</svg>
