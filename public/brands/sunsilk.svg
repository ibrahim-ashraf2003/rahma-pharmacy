    <path d="M 145 35 L 145 115 C 145 135, 160 148, 185 148 C 210 148, 225 135, 225 115 L 225 35 L 250 35 L 250 115 C 250 150, 225 170, 185 170 C 145 170, 120 150, 120 115 L 120 35 Z" />

