<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 340" width="100%" height="100%">
  <!-- Exact Head & Shoulders Royal Blue -->
  <g fill="#0058a9" transform="translate(10, 10)">
    <!-- Swirl Icon / Emblem on Left -->
    <g transform="translate(110, 115) rotate(-28)">
      <!-- Outer Oval Ring -->
      <path d="M 0 -95 C 60 -95, 100 -50, 100 0 C 100 50, 60 95, 0 95 C -60 95, -100 50, -100 0 C -100 -50, -60 -95, 0 -95 Z M 0 -70 C -45 -70, -75 -35, -75 0 C -75 35, -45 70, 0 70 C 45 70, 75 35, 75 0 C 75 -35, 45 -70, 0 -70 Z" />
      <!-- Inner Dynamic Swirl Drop -->
      <path d="M -30 -30 C -10 -65, 30 -50, 45 -20 C 60 10, 40 50, 10 50 C -25 50, -50 0, -30 -30 Z" />
    </g>

    <!-- Typography: "head &" (line 1) and "shoulders" (line 2) -->
    <g transform="translate(210, 0)">
      <text 
        x="0" 
        y="180" 
        font-family="'Futura', 'Trebuchet MS', 'Arial', sans-serif" 
        font-weight="900" 
        font-style="italic" 
        font-size="115" 
        letter-spacing="-2px"
      >
        head&amp;
      </text>
      <text 
        x="0" 
        y="280" 
        font-family="'Futura', 'Trebuchet MS', 'Arial', sans-serif" 
        font-weight="900" 
        font-style="italic" 
        font-size="115" 
        letter-spacing="-2px"
      >
        shoulders
      </text>

      <!-- Registered Trademark ® -->
      <g transform="translate(560, 275)">
        <circle cx="12" cy="-8" r="14" stroke="#0058a9" stroke-width="3" fill="none" />
        <text x="12" y="-3" font-family="sans-serif" font-weight="900" font-size="16" fill="#0058a9" text-anchor="middle">R</text>
      </g>
    </g>
  </g>
</svg>
