<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" width="100%" height="100%">
  <defs>
    <!-- 3D Red Gloss Gradient -->
    <linearGradient id="johnsonRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff3333" />
      <stop offset="40%" stop-color="#e00000" />
      <stop offset="100%" stop-color="#990000" />
    </linearGradient>

    <filter id="johnsonBevel" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="3" stdDeviation="2" flood-color="#800000" flood-opacity="0.4"/>
    </filter>

    <style>
      .jj-script {
        font-family: "Brush Script MT", "Snell Roundhand", "Caveat", "Segoe Script", "Great Vibes", cursive;
        font-size: 138px;
        font-style: italic;
        font-weight: 700;
      }
    </style>
  </defs>

  <g filter="url(#johnsonBevel)" transform="translate(15, 10)">
    <!-- Base Deep Stroke for 3D Tubular Look -->
    <text 
      x="345" 
      y="145" 
      class="jj-script"
      fill="#b80000"
      stroke="#900000"
      stroke-width="12"
      stroke-linejoin="round"
      stroke-linecap="round"
      text-anchor="middle"
    >
      Johnson&amp;Johnson
    </text>

    <!-- Main Rich Red Body -->
    <text 
      x="345" 
      y="145" 
      class="jj-script"
      fill="url(#johnsonRed)"
      stroke="url(#johnsonRed)"
      stroke-width="6"
      stroke-linejoin="round"
      stroke-linecap="round"
      text-anchor="middle"
    >
      Johnson&amp;Johnson
    </text>

    <!-- Top Gloss White Highlight -->
    <text 
      x="344" 
      y="143" 
      class="jj-script"
      fill="none"
      stroke="#ffffff"
      stroke-width="1.8"
      stroke-linecap="round"
      opacity="0.5"
      text-anchor="middle"
    >
      Johnson&amp;Johnson
    </text>
  </g>
</svg>
