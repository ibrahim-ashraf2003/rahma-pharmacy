<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 420" width="100%" height="100%">
  <defs>
    <!-- Rich Metallic Gold Gradient -->
    <linearGradient id="panteneGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae092" />
      <stop offset="25%" stop-color="#dfa94b" />
      <stop offset="50%" stop-color="#b67a22" />
      <stop offset="75%" stop-color="#f5d680" />
      <stop offset="100%" stop-color="#8a5309" />
    </linearGradient>

    <!-- Deep Midnight Blue for PANTENE -->
    <linearGradient id="panteneNavy" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#071233" />
      <stop offset="100%" stop-color="#020717" />
    </linearGradient>
  </defs>

  <!-- Golden Wing / Ribbon Flourish -->
  <g transform="translate(250, 10)">
    <!-- Main Top Feather/Ribbon Curve -->
    <path d="M 210 0 C 190 60, 120 120, 60 160 C 120 120, 180 80, 210 0 Z" fill="url(#panteneGold)" />
    <!-- Layer 2 Feather -->
    <path d="M 230 60 C 180 130, 90 190, 20 230 C 90 190, 170 140, 230 60 Z" fill="url(#panteneGold)" />
    <!-- Layer 3 Feather -->
    <path d="M 210 160 C 140 220, 60 270, 0 300 C 60 270, 130 220, 210 160 Z" fill="url(#panteneGold)" />
    <!-- Layer 4 Bottom Curl -->
    <path d="M 180 240 C 120 280, 50 320, 10 350 C 30 330, 100 290, 180 240 Z" fill="url(#panteneGold)" />
    <!-- Lower Tail Swirl -->
    <path d="M 0 300 C -10 340, -40 370, -80 380 C -40 370, -10 340, 0 300 Z" fill="url(#panteneGold)" />
    <path d="M -80 380 C -30 380, 10 340, 30 320 C 0 350, -40 375, -80 380 Z" fill="url(#panteneGold)" />
  </g>

  <!-- PANTENE Wordmark with Gold Bevel Stroke -->
  <g transform="translate(25, 335)">
    <text 
      x="0" 
      y="0" 
      font-family="'Playfair Display', 'Bodoni MT', 'Times New Roman', serif" 
      font-weight="900" 
      font-size="92" 
      letter-spacing="4px"
      fill="url(#panteneNavy)"
      stroke="url(#panteneGold)"
      stroke-width="3.5"
      stroke-linejoin="round"
    >
      PANTENE
    </text>
  </g>

  <!-- PRO-V Wordmark -->
  <g transform="translate(410, 385)">
    <text 
      x="0" 
      y="0" 
      font-family="'Montserrat', 'Arial', sans-serif" 
      font-weight="900" 
      font-size="44" 
      letter-spacing="2px"
      fill="url(#panteneNavy)"
      stroke="url(#panteneGold)"
      stroke-width="1.5"
    >
      PRO-V
    </text>
  </g>
</svg>
