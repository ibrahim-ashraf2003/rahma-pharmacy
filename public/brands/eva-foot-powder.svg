<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 110" fill="none">
  <!-- EVA FOOT text in forest green -->
  <g transform="translate(150, 42)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="38" fill="#005a2b" text-anchor="middle" letter-spacing="4">EVA FOOT</text>
  </g>
  <!-- Metallic Bar with POWDER -->
  <defs>
    <linearGradient id="metalPlate" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="25%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="75%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>
  <rect x="20" y="58" width="260" height="32" rx="4" fill="url(#metalPlate)" stroke="#1e293b" stroke-width="1"/>
  <g transform="translate(150, 81)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="20" fill="#004d25" text-anchor="middle" letter-spacing="10">POWDER</text>
  </g>
</svg>
