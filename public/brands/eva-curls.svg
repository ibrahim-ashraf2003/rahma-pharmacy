<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 120" fill="none">
  <!-- Eva Logo in Purple -->
  <g transform="translate(75, 6) scale(0.7)">
    <polygon points="30,5 50,5 60,22 50,40 30,40 20,22" stroke="#6b2d8a" stroke-width="3" fill="none" stroke-linejoin="round"/>
    <polygon points="70,5 90,5 100,22 90,40 70,40 60,22" stroke="#6b2d8a" stroke-width="3" fill="none" stroke-linejoin="round"/>
    <polygon points="110,5 130,5 140,22 130,40 110,40 100,22" stroke="#6b2d8a" stroke-width="3" fill="none" stroke-linejoin="round"/>
    <text x="40" y="27" font-family="'Times New Roman', serif" font-style="italic" font-weight="bold" font-size="22" fill="#6b2d8a" text-anchor="middle">Є</text>
    <text x="80" y="27" font-family="'Times New Roman', serif" font-style="italic" font-weight="bold" font-size="22" fill="#6b2d8a" text-anchor="middle">υ</text>
    <text x="120" y="27" font-family="'Times New Roman', serif" font-style="italic" font-weight="bold" font-size="22" fill="#6b2d8a" text-anchor="middle">a</text>
    <path d="M 15 48 Q 80 42 145 48" stroke="#6b2d8a" stroke-width="2.5" fill="none"/>
    <text x="80" y="60" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="12" fill="#6b2d8a" text-anchor="middle" letter-spacing="3">HAIR CLINIC</text>
  </g>
  <!-- Metallic Curls text -->
  <defs>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#e2e8f0"/>
      <stop offset="60%" stop-color="#94a3b8"/>
      <stop offset="85%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>
  <g transform="translate(140, 105)">
    <text x="0" y="0" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-weight="900" font-size="44" fill="url(#silverGrad)" stroke="#6b2d8a" stroke-width="1.5" text-anchor="middle" letter-spacing="1">Curls</text>
  </g>
</svg>
