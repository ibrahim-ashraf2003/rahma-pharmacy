<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 240" width="100%" height="100%">
  <defs>
    <!-- Butterfly Gradient -->
    <linearGradient id="mywayWingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ab5dbf" />
      <stop offset="50%" stop-color="#8a30a8" />
      <stop offset="100%" stop-color="#580f7d" />
    </linearGradient>

    <!-- Swoosh Gradient -->
    <linearGradient id="mywaySwooshGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#600f7a" />
      <stop offset="50%" stop-color="#7a147d" />
      <stop offset="100%" stop-color="#93135c" />
    </linearGradient>

    <style>
      .myway-title {
        font-family: "Cinzel", "Playfair Display", "Times New Roman", "Baskerville", serif;
        font-weight: 700;
        font-size: 104px;
        fill: #8f0e44;
        letter-spacing: 2px;
      }
      .myway-arabic {
        font-family: "Amiri", "Traditional Arabic", "Cairo", "Tahoma", serif;
        font-weight: 700;
        font-size: 44px;
        fill: #8f0e44;
      }
    </style>
  </defs>

  <!-- MY WAY Serif English Wordmark -->
  <text x="35" y="112" class="myway-title">MY WAY</text>

  <!-- Dynamic Curved Purple Swoosh -->
  <path d="M 28 148 C 140 128, 280 148, 410 188 C 470 206, 520 188, 595 146 C 510 208, 420 216, 320 186 C 180 144, 80 156, 28 148 Z" fill="url(#mywaySwooshGrad)" />

  <!-- Arabic Tagline "عائلة واحدة" -->
  <text x="35" y="202" class="myway-arabic">عائلة واحدة</text>

  <!-- Stylized Butterfly Wing Cluster on Right -->
  <g transform="translate(485, 60)">
    <!-- Top-Left Upper Wing -->
    <path d="M 45 92 C 30 50, 10 32, 4 30 C 2 55, 18 80, 45 92 Z" fill="url(#mywayWingGrad)" opacity="0.9" />
    <path d="M 12 36 C 24 54, 38 72, 45 92" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>

    <!-- Top-Right Main Upper Wing -->
    <path d="M 45 92 C 60 30, 85 4, 98 2 C 100 28, 86 65, 45 92 Z" fill="url(#mywayWingGrad)" />
    <path d="M 85 15 C 75 42, 60 68, 45 92" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>

    <!-- Bottom-Right Lower Wing -->
    <path d="M 45 92 C 90 90, 130 110, 138 126 C 114 136, 75 125, 45 92 Z" fill="url(#mywayWingGrad)" />
    <path d="M 120 120 C 95 115, 70 105, 45 92" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.6"/>

    <!-- Bottom-Left Lower Wing -->
    <path d="M 45 92 C 40 122, 35 150, 40 162 C 55 152, 60 124, 45 92 Z" fill="url(#mywayWingGrad)" opacity="0.95" />
    <path d="M 40 148 C 42 130, 44 110, 45 92" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>

    <!-- Delicate Antennae -->
    <path d="M 45 90 C 60 70, 80 58, 105 56" stroke="#580f7d" stroke-width="2" stroke-linecap="round" fill="none" />
  </g>
</svg>
