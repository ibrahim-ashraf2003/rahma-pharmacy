<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 380" width="100%" height="100%">
  <defs>
    <!-- Deep Vaseline Blue Gradient -->
    <radialGradient id="vaselineBlue" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0b59b8" />
      <stop offset="60%" stop-color="#022a7a" />
      <stop offset="100%" stop-color="#001447" />
    </radialGradient>

    <!-- Chrome Silver Gradient for Bezel -->
    <linearGradient id="silverBezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f7fa" />
      <stop offset="25%" stop-color="#b0b8c4" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="75%" stop-color="#808a9c" />
      <stop offset="100%" stop-color="#d6dce6" />
    </linearGradient>

    <filter id="vaselineShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000e30" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer Silver Frame -->
  <g filter="url(#vaselineShadow)" transform="translate(10, 10)">
    <!-- Outer Curved Octagon / Shield -->
    <path d="M 120 15 C 220 0, 410 0, 510 15 L 610 100 C 625 140, 625 220, 610 260 L 510 345 C 410 360, 220 360, 120 345 L 20 260 C 5 220, 5 140, 20 100 Z" 
          fill="url(#silverBezel)" />
    
    <!-- Inner Blue Body -->
    <path d="M 125 25 C 220 12, 405 12, 505 25 L 598 105 C 612 142, 612 218, 598 255 L 505 335 C 405 348, 220 348, 125 335 L 32 255 C 18 218, 18 142, 32 105 Z" 
          fill="url(#vaselineBlue)" />

    <!-- Vaseline Pure White Typography -->
    <g fill="#ffffff" transform="translate(60, 120)">
      <text 
        x="255" 
        y="110" 
        font-family="'Futura', 'Montserrat', 'Arial Black', sans-serif" 
        font-weight="900" 
        font-size="122" 
        letter-spacing="-3px" 
        text-anchor="middle"
      >
        Vaseline
      </text>
      <!-- Registered Trademark ® -->
      <circle cx="515" cy="40" r="10" stroke="#ffffff" stroke-width="2" fill="none" />
      <text x="515" y="44" font-family="sans-serif" font-weight="900" font-size="11" fill="#ffffff" text-anchor="middle">R</text>
    </g>
  </g>
</svg>
