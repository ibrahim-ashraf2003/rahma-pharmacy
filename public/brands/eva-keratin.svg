<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 120" fill="none">
  <!-- Eva Logo in Rich Burgundy Red -->
  <g transform="translate(75, 6) scale(0.7)">
    <polygon points="30,5 50,5 60,22 50,40 30,40 20,22" stroke="#8a1829" stroke-width="3" fill="none" stroke-linejoin="round"/>
    <polygon points="70,5 90,5 100,22 90,40 70,40 60,22" stroke="#8a1829" stroke-width="3" fill="none" stroke-linejoin="round"/>
    <polygon points="110,5 130,5 140,22 130,40 110,40 100,22" stroke="#8a1829" stroke-width="3" fill="none" stroke-linejoin="round"/>
    <text x="40" y="27" font-family="'Times New Roman', serif" font-style="italic" font-weight="bold" font-size="22" fill="#8a1829" text-anchor="middle">Є</text>
    <text x="80" y="27" font-family="'Times New Roman', serif" font-style="italic" font-weight="bold" font-size="22" fill="#8a1829" text-anchor="middle">υ</text>
    <text x="120" y="27" font-family="'Times New Roman', serif" font-style="italic" font-weight="bold" font-size="22" fill="#8a1829" text-anchor="middle">a</text>
    <path d="M 15 48 Q 80 42 145 48" stroke="#8a1829" stroke-width="2.5" fill="none"/>
