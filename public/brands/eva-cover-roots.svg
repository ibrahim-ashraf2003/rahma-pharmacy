<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 110" fill="none">
  <!-- Dark/Charcoal EVA COVER ROOTS -->
  <g transform="translate(150, 42)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="32" fill="#1e293b" text-anchor="middle" letter-spacing="3">EVA</text>
  </g>
  <defs>
    <linearGradient id="chromeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <g transform="translate(150, 84)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" fill="url(#chromeGradient)" text-anchor="middle" letter-spacing="2">COVER ROOTS</text>
  </g>
</svg>
