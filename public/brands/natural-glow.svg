<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 100" fill="none">
  <!-- Eva Logo -->
  <g transform="translate(75, 5) scale(0.65)">
    <!-- 3 Hexagons -->
    <polygon points="30,5 50,5 60,22 50,40 30,40 20,22" stroke="#1f2937" stroke-width="3" fill="none" stroke-linejoin="round"/>
    <polygon points="70,5 90,5 100,22 90,40 70,40 60,22" stroke="#1f2937" stroke-width="3" fill="none" stroke-linejoin="round"/>
    <polygon points="110,5 130,5 140,22 130,40 110,40 100,22" stroke="#1f2937" stroke-width="3" fill="none" stroke-linejoin="round"/>
    <!-- Eva Text -->
    <text x="40" y="27" font-family="'Times New Roman', serif" font-style="italic" font-weight="bold" font-size="22" fill="#1f2937" text-anchor="middle">Є</text>
    <text x="80" y="27" font-family="'Times New Roman', serif" font-style="italic" font-weight="bold" font-size="22" fill="#1f2937" text-anchor="middle">υ</text>
    <text x="120" y="27" font-family="'Times New Roman', serif" font-style="italic" font-weight="bold" font-size="22" fill="#1f2937" text-anchor="middle">a</text>
    <!-- Skin Care curve -->
    <path d="M 20 48 Q 80 43 140 48" stroke="#1f2937" stroke-width="1.5" fill="none"/>
    <text x="80" y="58" font-family="sans-serif" font-weight="600" font-size="10" fill="#1f2937" text-anchor="middle" letter-spacing="1">Skin Care</text>
  </g>
  <!-- NATURAL GLOW -->
  <text x="140" y="65" font-family="system-ui, sans-serif" font-weight="900" font-size="20" fill="#2d2a26" text-anchor="middle" letter-spacing="3">NATURAL GLOW</text>
  <!-- Divider -->
  <line x1="20" y1="74" x2="160" y2="74" stroke="#2d2a26" stroke-width="2"/>
  <!-- Arabic Text -->
  <text x="215" y="80" font-family="system-ui, 'Segoe UI', Tahoma, sans-serif" font-weight="bold" font-size="15" fill="#2d2a26" text-anchor="middle">إشراقة طبيعية</text>
</svg>
