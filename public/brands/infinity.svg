<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 380" width="100%" height="100%">
  <defs>
    <!-- Infinity Crown Bronze Gradient -->
    <linearGradient id="bronzeCrown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dd7b3e" />
      <stop offset="35%" stop-color="#b8511e" />
      <stop offset="70%" stop-color="#6e2b0a" />
      <stop offset="100%" stop-color="#a84717" />
    </linearGradient>

    <!-- 3D Blue Gradient for INFINITY -->
    <linearGradient id="infinityBlueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#058be6" />
      <stop offset="45%" stop-color="#0351a6" />
      <stop offset="100%" stop-color="#021f57" />
    </linearGradient>

    <filter id="infinity3D" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="3" stdDeviation="2" flood-color="#001133" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g transform="translate(10, 0)">
    <!-- Ornate Bronze Crown / Tiara -->
    <g transform="translate(170, 0)">
      <!-- Top Center Drop -->
      <path d="M 155 10 C 145 30, 145 45, 155 55 C 165 45, 165 30, 155 10 Z" fill="url(#bronzeCrown)" />
      <!-- Left Drops -->
      <path d="M 105 60 C 95 78, 95 90, 105 100 C 115 90, 115 78, 105 60 Z" fill="url(#bronzeCrown)" />
      <path d="M 70 100 C 60 115, 60 128, 70 135 C 80 128, 80 115, 70 100 Z" fill="url(#bronzeCrown)" />
      <!-- Right Drops -->
      <path d="M 205 60 C 195 78, 195 90, 205 100 C 215 90, 215 78, 205 60 Z" fill="url(#bronzeCrown)" />
      <path d="M 240 100 C 230 115, 230 128, 240 135 C 250 128, 250 115, 240 100 Z" fill="url(#bronzeCrown)" />

      <!-- Center Medallion with Roman "I" -->
      <circle cx="155" cy="115" r="36" fill="url(#bronzeCrown)" stroke="#e8894d" stroke-width="2.5" />
      <text x="155" y="132" font-family="'Times New Roman', serif" font-weight="900" font-size="52" fill="#ffffff" text-anchor="middle">I</text>

      <!-- Tiara Loops & Swirls -->
      <!-- Left Swirl Loop -->
      <path d="M 155 55 C 100 55, 60 100, 75 140 C 90 180, 145 180, 155 155" fill="none" stroke="url(#bronzeCrown)" stroke-width="8" stroke-linecap="round" />
      <path d="M 75 140 C 40 130, 25 150, 40 175 C 60 205, 130 205, 155 180" fill="none" stroke="url(#bronzeCrown)" stroke-width="7" stroke-linecap="round" />

      <!-- Right Swirl Loop -->
      <path d="M 155 55 C 210 55, 250 100, 235 140 C 220 180, 165 180, 155 155" fill="none" stroke="url(#bronzeCrown)" stroke-width="8" stroke-linecap="round" />
      <path d="M 235 140 C 270 130, 285 150, 270 175 C 250 205, 180 205, 155 180" fill="none" stroke="url(#bronzeCrown)" stroke-width="7" stroke-linecap="round" />

      <!-- Base Crown Pedestal Arch -->
      <path d="M 105 210 C 135 185, 175 185, 205 210 Z" fill="url(#bronzeCrown)" />
    </g>

    <!-- INFINITY 3D Wordmark -->
    <g filter="url(#infinity3D)" transform="translate(15, 220)">
      <text 
        x="300" 
        y="80" 
        font-family="'Futura', 'Montserrat', 'Arial', sans-serif" 
        font-weight="800" 
        font-size="88" 
        letter-spacing="5px" 
        fill="url(#infinityBlueGrad)"
        stroke="#042a66"
        stroke-width="3"
        stroke-linejoin="round"
        text-anchor="middle"
      >
        INFINITY
      </text>
      <!-- Gloss Highlight Top -->
      <text 
        x="299" 
        y="78" 
        font-family="'Futura', 'Montserrat', 'Arial', sans-serif" 
        font-weight="800" 
        font-size="88" 
        letter-spacing="5px" 
        fill="none"
        stroke="#60baff"
        stroke-width="1.2"
        opacity="0.6"
        text-anchor="middle"
      >
        INFINITY
      </text>
    </g>

    <!-- Subtitle: SPANISH INNOVATION FOR ENDLESS BEAUTY with lines -->
    <g transform="translate(315, 335)">
      <!-- Left Line -->
      <line x1="-285" y1="-5" x2="-245" y2="-5" stroke="#042a66" stroke-width="2.5" />
      <!-- Text -->
      <text 
        x="0" 
        y="0" 
        font-family="'Montserrat', 'Arial', sans-serif" 
        font-weight="700" 
        font-size="16.5" 
        letter-spacing="3.5px" 
        fill="#042a66" 
        text-anchor="middle"
      >
        SPANISH INNOVATION FOR ENDLESS BEAUTY
      </text>
      <!-- Right Line -->
      <line x1="245" y1="-5" x2="285" y2="-5" stroke="#042a66" stroke-width="2.5" />
    </g>
  </g>
</svg>
