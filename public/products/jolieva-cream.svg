<!-- JoliEva Bleaching Cream Box -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8f9fa"/>
    </linearGradient>
    <linearGradient id="boxFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#be185d"/>
      <stop offset="50%" stop-color="#9d174d"/>
      <stop offset="100%" stop-color="#831843"/>
    </linearGradient>
    <linearGradient id="boxTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="boxSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#831843"/>
      <stop offset="100%" stop-color="#500724"/>
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="400" height="500" fill="url(#bg3)"/>
  <ellipse cx="200" cy="420" rx="110" ry="16" fill="#000" opacity="0.12"/>
  
  <!-- 3D Box in Isometric View -->
  <g filter="url(#shadow3)">
    <!-- Top Face -->
    <polygon points="120,180 230,130 330,170 220,220" fill="url(#boxTop)" stroke="#fbcfe8" stroke-width="1"/>
    <text x="225" y="180" font-family="serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle" transform="rotate(-15 225 180)">JOLIEVA</text>
    
    <!-- Left Side Face -->
    <polygon points="120,180 220,220 220,380 120,340" fill="url(#boxSide)"/>
    <text x="170" y="270" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fbcfe8" text-anchor="middle" transform="rotate(22 170 270)">جولي إيفا</text>
    
    <!-- Front Face -->
    <polygon points="220,220 330,170 330,330 220,380" fill="url(#boxFront)"/>
    <text x="275" y="250" font-family="serif" font-size="18" font-weight="900" fill="#ffffff" text-anchor="middle">✻</text>
    <text x="275" y="275" font-family="serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">JOLIEVA</text>
    <text x="275" y="295" font-family="sans-serif" font-size="8" font-weight="700" fill="#fce7f3" text-anchor="middle">Facial &amp; Body Hair Bleaching</text>
    <text x="275" y="310" font-family="sans-serif" font-size="8" font-weight="700" fill="#fce7f3" text-anchor="middle">Cream</text>
  </g>
</svg>
