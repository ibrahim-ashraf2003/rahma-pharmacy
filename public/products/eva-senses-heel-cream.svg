<!-- Eva Senses Heel Cream In The Clouds (Pink Tube) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg7" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8f9fa"/>
    </linearGradient>
    <linearGradient id="tubePink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fce7f3"/>
      <stop offset="50%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <filter id="shadow7" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="400" height="500" fill="url(#bg7)"/>
  <ellipse cx="200" cy="460" rx="60" ry="10" fill="#000" opacity="0.1"/>
  
  <g filter="url(#shadow7)">
    <!-- Squeeze Tube Body -->
    <path d="M 140 120 L 260 120 L 245 400 L 155 400 Z" fill="url(#tubePink)" stroke="#f472b6" stroke-width="1.5"/>
    
    <!-- Top Crimped Edge -->
    <rect x="135" y="105" width="130" height="20" fill="#fbcfe8" stroke="#f472b6" stroke-width="1.5"/>
    
    <!-- White Cap at bottom -->
    <rect x="160" y="400" width="80" height="45" rx="4" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
    
    <!-- Tube Branding -->
    <text x="200" y="160" font-family="sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">eva</text>
    <text x="200" y="178" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">SKIN CARE</text>
    <text x="200" y="210" font-family="cursive, serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">In the</text>
    <text x="200" y="235" font-family="cursive, serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">Clouds</text>
    
    <rect x="155" y="260" width="90" height="22" rx="4" fill="#ffffff" opacity="0.85"/>
    <text x="200" y="275" font-family="sans-serif" font-size="9" font-weight="900" fill="#db2777" text-anchor="middle">HEEL CREAM</text>

    <!-- Cloud graphic -->
    <path d="M 160 330 Q 180 305 200 325 Q 220 305 240 330 Z" fill="#ffffff" opacity="0.6"/>
    <text x="200" y="365" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">senses</text>
    <text x="200" y="385" font-family="sans-serif" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle">60 ml</text>
  </g>
</svg>
