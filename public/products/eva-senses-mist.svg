<!-- Eva Senses In the Clouds Body Mist 85ml -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8f9fa"/>
    </linearGradient>
    <linearGradient id="bottlePink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbcfe8"/>
      <stop offset="50%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="capSilver" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e5e7eb"/>
      <stop offset="50%" stop-color="#f9fafb"/>
      <stop offset="100%" stop-color="#9ca3af"/>
    </linearGradient>
    <filter id="shadow4" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="400" height="500" fill="url(#bg4)"/>
  <ellipse cx="200" cy="455" rx="55" ry="10" fill="#000" opacity="0.1"/>
  
  <!-- Mist Spray Cap Transparent -->
  <rect x="175" y="80" width="50" height="70" rx="6" fill="#ffffff" opacity="0.6" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="186" y="110" width="28" height="35" rx="3" fill="url(#capSilver)"/>
  <rect x="194" y="95" width="12" height="15" fill="#e5e7eb"/>

  <!-- Bottle Body -->
  <rect x="160" y="150" width="80" height="290" rx="20" fill="url(#bottlePink)" stroke="#f472b6" stroke-width="1" filter="url(#shadow4)"/>
  
  <!-- Cloud graphic & Label -->
  <path d="M 170 300 Q 185 280 200 295 Q 215 275 230 300 Z" fill="#ffffff" opacity="0.4"/>
  <path d="M 165 350 Q 180 330 200 345 Q 220 325 235 350 Z" fill="#ffffff" opacity="0.4"/>

  <text x="200" y="220" font-family="sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">eva</text>
  <text x="200" y="238" font-family="sans-serif" font-size="16" font-weight="300" fill="#ffffff" text-anchor="middle" letter-spacing="3">senses</text>
  
  <text x="200" y="275" font-family="cursive, serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">In the</text>
  <text x="200" y="295" font-family="cursive, serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Clouds</text>

  <text x="200" y="415" font-family="sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">85 ml</text>
</svg>
