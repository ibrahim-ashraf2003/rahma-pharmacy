<!-- Eva Advanced Care Clinic Forever Long Hair Oil (Box + Dropper) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8f9fa"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9ca3af"/>
      <stop offset="50%" stop-color="#6b7280"/>
      <stop offset="100%" stop-color="#4b5563"/>
    </linearGradient>
    <linearGradient id="bottlePink6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <filter id="shadow6" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="400" height="500" fill="url(#bg6)"/>
  <ellipse cx="200" cy="455" rx="105" ry="14" fill="#000" opacity="0.12"/>
  
  <g filter="url(#shadow6)">
    <!-- Box on Left -->
    <rect x="90" y="140" width="95" height="300" rx="6" fill="url(#boxGrad)" stroke="#374151" stroke-width="1.5"/>
    <text x="137" y="180" font-family="serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">eva</text>
    <text x="137" y="195" font-family="sans-serif" font-size="8" font-weight="700" fill="#fce7f3" text-anchor="middle">ADVANCED CARE</text>
    <text x="137" y="210" font-family="sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">CLINIC</text>
    
    <rect x="100" y="225" width="75" height="24" rx="4" fill="#f43f5e"/>
    <text x="137" y="241" font-family="sans-serif" font-size="9" font-weight="900" fill="#ffffff" text-anchor="middle">10 BOOSTER OILS</text>
    
    <text x="137" y="280" font-family="sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">FOREVER</text>
    <text x="137" y="295" font-family="sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">LONG</text>
    <text x="137" y="320" font-family="sans-serif" font-size="9" font-weight="bold" fill="#e5e7eb" text-anchor="middle">HAIR OIL 55ml</text>

    <!-- Dropper Bottle on Right -->
    <!-- Dropper Top -->
    <rect x="238" y="160" width="24" height="35" rx="3" fill="#111827"/>
    <rect x="232" y="190" width="36" height="15" rx="2" fill="#d1d5db"/>
    
    <!-- Bottle -->
    <rect x="215" y="205" width="70" height="235" rx="14" fill="url(#bottlePink6)" stroke="#be185d" stroke-width="1"/>
    
    <text x="250" y="250" font-family="serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">eva</text>
    <text x="250" y="275" font-family="sans-serif" font-size="9" font-weight="900" fill="#ffffff" text-anchor="middle">FOREVER LONG</text>
    <text x="250" y="300" font-family="sans-serif" font-size="8" font-weight="bold" fill="#fce7f3" text-anchor="middle">زيت لتطويل الشعر</text>
    <text x="250" y="315" font-family="sans-serif" font-size="7" font-weight="bold" fill="#fce7f3" text-anchor="middle">والرموش والحواجب</text>
  </g>
  
  <!-- Ribbon Banner -->
  <path d="M 230 360 L 330 360 L 320 380 L 220 380 Z" fill="#ec4899" opacity="0.9"/>
  <text x="275" y="375" font-family="sans-serif" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle">FOREVER LONG</text>
</svg>
