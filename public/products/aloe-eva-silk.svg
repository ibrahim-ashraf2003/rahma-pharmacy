<!-- Aloe Eva Hair Mask Aloe & Silk Proteins (Pink Pouch) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8f9fa"/>
    </linearGradient>
    <linearGradient id="pouch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f3f4f6"/>
      <stop offset="100%" stop-color="#e5e7eb"/>
    </linearGradient>
    <linearGradient id="pinkBand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="400" height="500" fill="url(#bg)"/>
  
  <!-- Shadow Base -->
  <ellipse cx="200" cy="460" rx="90" ry="12" fill="#000" opacity="0.08"/>
  
  <!-- Spout / Cap -->
  <rect x="188" y="60" width="24" height="25" rx="3" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.5"/>
  <rect x="184" y="52" width="32" height="12" rx="2" fill="#d1d5db" stroke="#9ca3af" stroke-width="1.5"/>

  <!-- Pouch Body -->
  <path d="M 140 80 Q 200 75 260 80 Q 295 180 290 380 Q 285 450 200 455 Q 115 450 110 380 Q 105 180 140 80 Z" 
        fill="url(#pouch)" stroke="#d1d5db" stroke-width="2" filter="url(#shadow)"/>
  
  <!-- Branding -->
  <text x="200" y="145" font-family="sans-serif" font-size="28" font-weight="900" fill="#2d6a4f" text-anchor="middle" letter-spacing="1">Aloe</text>
  <text x="200" y="175" font-family="sans-serif" font-size="32" font-weight="900" fill="#1b4332" text-anchor="middle" letter-spacing="2">Eva</text>
  <text x="200" y="195" font-family="sans-serif" font-size="10" font-weight="700" fill="#4b5563" text-anchor="middle" letter-spacing="3">STRENGTHENING</text>
  <text x="200" y="210" font-family="sans-serif" font-size="14" font-weight="800" fill="#111827" text-anchor="middle" letter-spacing="1">HAIR MASK</text>
  
  <!-- Aloe Leaf Graphic -->
  <path d="M 150 240 Q 200 225 250 235 Q 230 255 150 240 Z" fill="#2d6a4f"/>
  <path d="M 165 242 Q 200 232 235 240" stroke="#52b788" stroke-width="2" fill="none"/>

  <!-- Pink Banner -->
  <rect x="125" y="255" width="150" height="24" rx="12" fill="url(#pinkBand)"/>
  <text x="200" y="271" font-family="sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">WITH ALOE VERA &amp; SILK PROTEINS</text>
  
  <!-- Arabic Text -->
  <text x="200" y="300" font-family="sans-serif" font-size="11" font-weight="bold" fill="#374151" text-anchor="middle">بالصبار وبروتينات الحرير</text>
  <text x="200" y="320" font-family="sans-serif" font-size="9" font-weight="bold" fill="#6b7280" text-anchor="middle">للشعر التالف والمصبوغ</text>
  
  <!-- Weight badge -->
  <circle cx="200" cy="400" r="18" fill="#f3f4f6" stroke="#e5e7eb" stroke-width="1"/>
  <text x="200" y="404" font-family="sans-serif" font-size="10" font-weight="900" fill="#374151" text-anchor="middle">250g</text>
</svg>
